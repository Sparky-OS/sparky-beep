# Sparky Beep Configuration File
# Controls beep mode and default settings
#
# This file will be installed to: /etc/sparky-beep/beep.conf
# Edit this file to customize beep behavior system-wide

# BEEP MODE
# Determines which beep engine to use
# Options: binary, ternary
#
# binary  - Standard beep (square waves, harsh sound)
#           Compatible with all systems, no compilation needed
#           Uses: /usr/bin/beep
#
# ternary - Ternary beep (smoother, more musical sound)
#           Requires tbeep to be compiled and installed
#           Uses: /usr/bin/tbeep
#
# Default: binary (safest option)
BEEP_MODE="binary"

# BEEP COMMAND
# Path to the beep executable
# This is automatically set based on BEEP_MODE
# You can override it manually if needed
#
# Default for binary mode: beep
# Default for ternary mode: tbeep
BEEP_COMMAND="beep"

# DEFAULT TEMPO
# Default tempo in beats per minute (BPM) for compositions
# Range: 40-240 BPM
# Common values:
#   40-60   - Largo (very slow)
#   60-80   - Adagio (slow)
#   80-100  - Andante (walking pace)
#   100-120 - Moderato (moderate)
#   120-140 - Allegro (fast)
#   140-180 - Vivace (very fast)
#   180-240 - Presto (extremely fast)
#
# Default: 120 BPM (moderate)
DEFAULT_TEMPO=120

# DEFAULT OCTAVE
# Default octave for musical notation
# Range: 0-8
# Common values:
#   3 - Low octave
#   4 - Middle octave (standard, contains middle C)
#   5 - High octave
#
# Default: 4 (middle octave)
DEFAULT_OCTAVE=4

# ENABLE COMPOSITIONS
# Whether to enable the beep composer for musical notation
# Options: yes, no
#
# When enabled:
#   - Init scripts can use .beepmusic composition files
#   - sparky-beep-compose is available for creating music
#   - Musical notation can be used in service beeps
#
# When disabled:
#   - Only raw beep commands are used (backward compatible)
#
# Default: yes
ENABLE_COMPOSITIONS="yes"

# COMPOSITION DIRECTORY
# Directory containing .beepmusic composition files
# Default: /usr/share/sparky-beep/compositions
COMPOSITION_DIR="/usr/share/sparky-beep/compositions"

# LOGGING
# Enable logging of beep events
# Options: yes, no
# Default: no
ENABLE_LOGGING="no"

# LOG FILE
# Where to log beep events (if logging enabled)
# Default: /var/log/sparky-beep.log
LOG_FILE="/var/log/sparky-beep.log"

# FALLBACK TO BINARY
# If ternary mode is enabled but tbeep is not available,
# automatically fall back to binary mode
# Options: yes, no
# Default: yes
FALLBACK_TO_BINARY="yes"

#
# Advanced Settings
#

# TERNARY PATTERN LENGTH
# For ternary beep mode, controls smoothness vs performance
# Higher values = smoother sound, but slower state transitions
# Range: 6-24
# Default: 12
TERNARY_PATTERN_LENGTH=12

# MINIMUM BEEP DURATION
# Minimum duration for any beep in milliseconds
# Prevents extremely short beeps that may cause hardware issues
# Default: 50ms
MIN_BEEP_DURATION=50

# MAXIMUM BEEP DURATION
# Maximum duration for any beep in milliseconds
# Prevents extremely long beeps that may be annoying
# Default: 5000ms (5 seconds)
MAX_BEEP_DURATION=5000

# INTER_BEEP_DELAY
# Default delay between sequential beeps in milliseconds
# Default: 100ms
INTER_BEEP_DELAY=100
