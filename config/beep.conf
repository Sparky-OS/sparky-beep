# Sparky Beep Configuration File
# Installed as /etc/sparky-beep/beep.conf; sparky-beep-config edits it, the
# composer and the beep services read it. Sections and key=value lines.

[general]
# beep_mode: binary (the beep command). "ternary" hands the same command to a
# tbeep program if one is installed; Sparky Beep ships none.
beep_mode=binary
# language: two-letter code, or "auto" to follow LANG
language=en
# auto_enable: enable a beep service when its package is found
auto_enable=true
# log_events: write beep events to the system log
log_events=false
# Composer defaults: tempo in BPM (40-240), octave (0-8)
default_tempo=120
default_octave=4

[schedule]
# Quiet hours: no beeps between quiet_hours_start and quiet_hours_end
enabled=false
quiet_hours_start=22:00
quiet_hours_end=07:00
# Weekdays the schedule applies to: 1=Monday, 7=Sunday
active_weekdays=1,2,3,4,5,6,7

[services]
# service=enabled|tune_start|tune_stop|tune_restart
beep_sys=true|default|default|default
beep_netdata=true|default|default|default
beep_samba=true|imperial-march|default|default
beep_webmin=true|default|default|default

[schedule_rules]
# rule_name=service|event|weekdays|start_time|end_time|action
# Example: quiet_night=*|*|1,2,3,4,5|22:00|07:00|disable
